plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
    id "com.github.johnrengelman.shadow" version "8.1.0"
}

version = project.mod_version
group = project.maven_group

def useLocalizedArchiveName = Locale.default.country.equalsIgnoreCase("Country")

base {
    archivesName = useLocalizedArchiveName
            ? "[交相辉映]${project.archives_base_name}"
            : project.archives_base_name
}

repositories {
    mavenLocal()
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    maven {
        name = "Shadow"
        url = "https://maven.bawnorton.com"
    }
    maven {
        name = "MixinSquared"
        url = "https://maven.bawnorton.com/releases"
    }
    maven {
        name = "ModdedMITE"
        url = "https://maven.limingzxc.top/repository/maven-public/"
    }
}

configurations {
    fml
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("it.unimi.dsi:fastutil:8.5.12")
    implementation("com.google.code.gson:gson:2.11.0")

    fml "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"

    shadow(annotationProcessor "com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.2.0")

    implementation "org.moddedmite:rusted-iron-core:1.5.7"
    implementation "com.github.MinecraftIsTooEasy:ManyLib:2.3.1"

    implementation "org.moddedmite:beyond-extreme:3.0.11"
    implementation "com.github.MinecraftIsTooEasy:Extreme:0.1.6.13"
    implementation "org.moddedmite:MITE-ITE:2.0.30"
    implementation "org.moddedmite:mite-itf-reborn:17.3.0"
    localRuntime "org.moddedmite:waila:2.0.8"

}

shadowJar {
    configurations = [project.configurations.shadow]
    exclude("fabric.*")
//    relocate("com.bawnorton.mixinsquared", "org.moddedmite.modslinker.mixinsquared")
    mergeServiceFiles()
    archiveFileName = "${archives_base_name} [${version}].jar"
}

def fmlResolvedFile = configurations.fml.singleFile

loom {
    accessWidenerPath = file("src/main/resources/modslinker.accesswidener")
    mergedMinecraftJar()
    setFML(fmlResolvedFile)
    dependencies.add("mappings", fmlMCPMappings())
    mods {
        "ModsLinker" {
            sourceSet sourceSets.main
//            sourceSet sourceSets.client
//            sourceSet sourceSets.server
        }
    }
    runs {
        client {
            String name = project.username
            String width = project.screen_width
            String height = project.screen_height
            programArgs "--userProperties", "{}", "--username", name, "--session", "a.a.a.a", "--width", width, "--height", height
        }
//        server {
//            programArgs "--", ""
//        }
    }
}

processResources {
    inputs.properties(
            version: project.version,
            id: project.mod_id,
            name: project.mod_name
    )

    filesMatching("fml.mod.json") {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { String fileName -> "${fileName}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.maven_id
            from(components.java)
        }
    }

    repositories {
        // ModdedMITE release repository.
        maven {
            name = "ModdedMITE"
            url = uri("https://maven.limingzxc.top/repository/maven-releases/")
            credentials {
                // Read only from gradle.properties (user level, your gradle_home)
                username = project.findProperty("nexusUsername")
                password = project.findProperty("nexusPassword")
            }
        }
    }
}
